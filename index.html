<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MALIKA — Индивидуальный пошив</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Raleway:wght@200;300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #C9A96E;
      --gold-hi: #E8C98A;
      --white:   #F5F0EB;
      --dim:     rgba(245,240,235,0.48);
      --dark:    #0A0500;
      --expo:    cubic-bezier(0.19, 1, 0.22, 1);
    }

    body { background: var(--dark); overflow-x: hidden; }

    /* ══════════════════════════════════════
       LOADER
    ══════════════════════════════════════ */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #f0e5d2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease;
    }
    .loader.out {
      opacity: 0;
      pointer-events: none;
    }
    .loader__wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .loader__gif {
      width: 240px;
      height: 240px;
      object-fit: contain;
      display: block;
    }

    /* «Загрузка» с проходящим светом */
    .loader__text {
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.48em;
      text-transform: uppercase;
      margin-top: -8px; /* подтягиваем вплотную к машинке */

      background: linear-gradient(
        90deg,
        #7a5c1e  0%,
        #7a5c1e 28%,
        #d4a03a 50%,
        #7a5c1e 72%,
        #7a5c1e 100%
      );
      background-size: 240% auto;
      background-position: -120% center;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmerText 2s linear infinite;
    }

    @keyframes shimmerText {
      0%   { background-position: -120% center; }
      100% { background-position: 180%  center; }
    }

    /* ══════════════════════════════════════
       HERO
    ══════════════════════════════════════ */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 640px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ── Фон ── */
    .hero__bg {
      position: absolute;
      inset: 0;             /* точно по размеру hero, без обрезки по ширине */
      background: url('67c1fb7a-13e8-46c1-8b94-6ad11b612cd4.png') center 38% / cover no-repeat;
      opacity: 0;
      will-change: opacity, background-position-y;
    }

    /* ── Оверлей: только верх и низ ── */
    .hero__overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to bottom, rgba(10,5,0,0.88) 0%, rgba(10,5,0,0.0) 30%),
        linear-gradient(to top,    rgba(10,5,0,0.88) 0%, rgba(10,5,0,0.0) 30%);
      pointer-events: none;
    }

    /* ── Контент ── */
    .hero__top,
    .hero__bottom {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ══════════════════════════════════════
       TOP — бренд
    ══════════════════════════════════════ */
    .hero__top {
      padding-top: clamp(38px, 6vh, 64px);
      gap: 13px;
    }

    /* Логотип — буквы падают сверху */
    .hero__brand {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: clamp(13px, 1.4vw, 16px);
      letter-spacing: 0.58em;
      color: var(--gold);
      display: flex;
      overflow: visible;   /* буквы анимируются снаружи */
    }

    .hero__brand .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(-22px);
    }
    .hero--ready .hero__brand .char {
      animation: charFall 0.7s var(--expo) calc(0.05s + var(--i) * 0.065s) forwards;
    }

    @keyframes charFall {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Разделитель */
    .hero__divider {
      width: 34px;
      height: 1px;
      background: var(--gold);
      opacity: 0;
      transform: scaleX(0);
      transform-origin: center;
    }
    .hero--ready .hero__divider {
      animation: lineOpen 0.7s var(--expo) 0.5s forwards;
    }

    @keyframes lineOpen {
      to { opacity: 1; transform: scaleX(1); }
    }

    /* Подпись */
    .hero__sub-clip {
      overflow: hidden;
    }

    .hero__sub {
      display: block;
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: clamp(9px, 0.85vw, 11px);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--dim);
      transform: translateY(110%);
    }
    .hero--ready .hero__sub {
      animation: revealUp 0.9s var(--expo) 0.65s forwards;
    }

    /* ══════════════════════════════════════
       BOTTOM — слоган + CTA
    ══════════════════════════════════════ */
    .hero__bottom {
      padding-bottom: clamp(38px, 6vh, 62px);
      gap: 24px;
    }

    /* Слоган — одна строка, слова в inline-масках */
    .hero__slogan {
      position: relative;
      text-align: center;
      white-space: nowrap;
    }

    /* Золотой блик — проходит один раз после появления слов */
    .hero__slogan::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 40%,
        rgba(232, 201, 138, 0.22) 50%,
        transparent 60%
      );
      background-size: 220% 100%;
      background-position: 180% 0;
      pointer-events: none;
    }
    .hero--ready .hero__slogan::after {
      animation: shimmer 1.4s var(--expo) 1.6s 1 forwards;
    }

    @keyframes shimmer {
      to { background-position: -80% 0; }
    }

    /* Маска для каждого слова — inline */
    .hero__word-clip {
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
    }

    .hero__word-clip + .hero__word-clip {
      margin-left: 0.22em;
    }

    .hero__word {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(28px, 3.6vw, 52px);
      color: var(--white);
      letter-spacing: 0.02em;
      transform: translateY(115%);
    }
    .hero--ready .hero__word {
      animation: revealUp 1.1s var(--expo) calc(0.3s + var(--w) * 0.18s) forwards;
    }

    @keyframes revealUp {
      to { transform: translateY(0); }
    }

    /* CTA — в маске */
    .hero__cta-clip {
      overflow: hidden;
    }

    .hero__cta {
      display: inline-block;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: clamp(9px, 0.9vw, 11px);
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid rgba(201,169,110,0.40);
      padding: 15px 44px;
      position: relative;
      overflow: hidden;
      transition: color 0.45s ease;
      transform: translateY(110%);
    }
    .hero--ready .hero__cta {
      animation: revealUp 0.9s var(--expo) 0.9s forwards;
    }

    /* Hover — заливка золотом */
    .hero__cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-102%);
      transition: transform 0.5s var(--expo);
    }
    .hero__cta:hover { color: var(--dark); }
    .hero__cta:hover::before { transform: translateX(0); }
    .hero__cta span { position: relative; z-index: 1; }

    /* ══════════════════════════════════════
       MOBILE
    ══════════════════════════════════════ */
    @media (max-width: 640px) {
      .hero__bg { background-position: 68% center; }

      .hero__word {
        font-size: clamp(34px, 11vw, 50px);
      }
    }
  </style>
</head>
<body>

<!-- ── LOADER ── -->
<div class="loader" id="loader">
  <div class="loader__wrap">
    <img class="loader__gif"
         src="ezgif-38342c2714f37f70.gif"
         alt="Загрузка">
    <span class="loader__text">Загрузка</span>
  </div>
</div>

<section class="hero">
  <div class="hero__bg"    id="heroBg"></div>
  <div class="hero__overlay"></div>

  <!-- Верх -->
  <div class="hero__top">
    <div class="hero__brand" id="brandEl">MALIKA</div>
    <div class="hero__divider"></div>
    <div class="hero__sub-clip">
      <span class="hero__sub">Индивидуальный пошив</span>
    </div>
  </div>

  <!-- Низ -->
  <div class="hero__bottom">
    <div class="hero__slogan">
      <span class="hero__word-clip"><span class="hero__word" style="--w:0">Дорого.</span></span><span class="hero__word-clip"><span class="hero__word" style="--w:1">Долго.</span></span><span class="hero__word-clip"><span class="hero__word" style="--w:2">Шикарно.</span></span>
    </div>

    <div class="hero__cta-clip">
      <a href="#contact" class="hero__cta"><span>Записаться на примерку</span></a>
    </div>
  </div>
</section>

<script>
  const bg   = document.getElementById('heroBg');
  const hero = document.querySelector('.hero');

  /* ── Loader ── */
  (function () {
    const loader = document.getElementById('loader');
    let pageReady = false;
    let minDone   = false;

    function startHero() {
      /* Плавное появление фона */
      bg.style.transition = 'opacity 2.2s cubic-bezier(0.19,1,0.22,1)';
      bg.style.opacity = '1';
      /* Запускаем все CSS-анимации на hero */
      hero.classList.add('hero--ready');
    }

    function tryHide() {
      if (!pageReady || !minDone) return;
      loader.classList.add('out');          /* лоадер начинает таять */
      startHero();                          /* одновременно стартует hero */
      setTimeout(() => loader.remove(), 1100);
    }

    window.addEventListener('load', () => { pageReady = true; tryHide(); });
    setTimeout(() => { minDone = true; tryHide(); }, 1200);
  }());

  /* ── Буквы MALIKA по одной ── */
  const brand = document.getElementById('brandEl');
  const letters = brand.textContent.trim().split('');
  brand.textContent = '';
  letters.forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'char';
    s.textContent = ch;
    s.style.setProperty('--i', i);
    brand.appendChild(s);
  });

  /* ── Parallax через backgroundPositionY ── */
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const y = window.pageYOffset;
      const h = document.querySelector('.hero').offsetHeight;
      if (y < h) {
        bg.style.backgroundPositionY = `calc(50% + ${(y / h) * 28}px)`;
      }
      ticking = false;
    });
  });
</script>

</body>
</html>
